name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node for TSX shell
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Build packaged TSX interface
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, Android lint and debug packages
        run: >-
          ./gradlew
          testDebugUnitTest
          lintDebug
          assembleDebug
          bundleDebug
          --stacktrace
          --no-daemon

      - name: Render APK quality report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-report
          report="release-report/APK-QUALITY-REPORT-${GITHUB_SHA}.md"
          cat > "$report" <<EOF
          # APK quality report — ${GITHUB_SHA}

          | Field | Value |
          |---|---|
          | Source commit | [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |
          | Remote workflow | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |
          | Build target | Debug APK/AAB candidate, ARM64 |
          | Automated checks | Gradle wrapper validation, unit tests, Android lint and debug packages |

          EOF
          cat docs/releases/CURRENT.md >> "$report"

      - name: Upload APK quality report
        uses: actions/upload-artifact@v4
        with:
          name: apk-quality-report-${{ github.sha }}
          path: release-report/APK-QUALITY-REPORT-${{ github.sha }}.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: overlay-translator-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 14

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node for TSX shell
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build packaged TSX interface
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_B64" || { echo "SIGNING_KEY is required for release packaging" >&2; exit 1; }
          keystore="$RUNNER_TEMP/overlay-translator-release.keystore"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "SIGNING_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Unit tests, Android lint and signed release package
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew
          testDebugUnitTest
          lintRelease
          assembleRelease
          bundleRelease
          --stacktrace
          --no-daemon

      - name: Verify release APK only
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          test ! -e app/build/outputs/apk/debug/app-debug.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Render APK quality report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-report
          report="release-report/APK-QUALITY-REPORT-${GITHUB_SHA}.md"
          cat > "$report" <<EOF
          # APK quality report — ${GITHUB_SHA}

          | Field | Value |
          |---|---|
          | Source commit | [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |
          | Remote workflow | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |
          | Build target | Signed release APK/AAB candidate, ARM64 |
          | Automated checks | Gradle wrapper validation, unit tests, release lint, release package and signing verification |

          EOF
          cat docs/releases/CURRENT.md >> "$report"

      - name: Upload APK quality report
        uses: actions/upload-artifact@v4
        with:
          name: apk-quality-report-${{ github.sha }}
          path: release-report/APK-QUALITY-REPORT-${{ github.sha }}.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: overlay-translator-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
